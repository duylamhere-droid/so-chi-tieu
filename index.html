<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sổ chi tiêu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --p:#2FA67F;--a:#F08C66;
  --card:#FFFFFF;--ink:#1F2421;--ink2:#545A56;--ink3:#878C88;--line:#ECEFED;--danger:#B3352F;
  --bg:color-mix(in srgb,var(--p) 8%,#F8F7F3);
  --p-soft:color-mix(in srgb,var(--p) 26%,var(--card));--p-ink:color-mix(in srgb,var(--p) 55%,#0b1a14);
  --a-soft:color-mix(in srgb,var(--a) 28%,var(--card));--a-ink:color-mix(in srgb,var(--a) 50%,#2a120a);
  --hero1:color-mix(in srgb,var(--p) 48%,var(--card));--hero2:color-mix(in srgb,var(--p) 30%,var(--card));
  --shadow:0 1px 2px rgba(20,30,25,.04),0 6px 18px rgba(20,30,25,.06);
  --r:20px;color-scheme:light;
}
:root[data-theme="dark"]{
  --card:#1E2320;--ink:#EEF0EC;--ink2:#B4B8B2;--ink3:#868A84;--line:#2D332F;--danger:#F0857D;
  --bg:color-mix(in srgb,var(--p) 7%,#121513);
  --p-soft:color-mix(in srgb,var(--p) 30%,var(--card));--p-ink:color-mix(in srgb,var(--p) 40%,#fff);
  --a-soft:color-mix(in srgb,var(--a) 30%,var(--card));--a-ink:color-mix(in srgb,var(--a) 40%,#fff);
  --hero1:color-mix(in srgb,var(--p) 52%,var(--card));--hero2:color-mix(in srgb,var(--p) 30%,var(--card));
  --shadow:none;
  color-scheme:dark;
}
:root[data-mau="dao"]{--p:#E57B5C;--a:#3BAA85}
:root[data-mau="oaihuong"]{--p:#7F73DB;--a:#E9849F}
:root[data-mau="vangbo"]{--p:#D49A2C;--a:#3FA3AD}
:root[data-mau="anhdao"]{--p:#E06A9E;--a:#7F73DB}
:root[data-mau="bien"]{--p:#4692DC;--a:#F08C66}
:root[data-mau="matcha"]{--p:#77A645;--a:#E08A60}
:root[data-mau="thanchi"]{--p:#5E6A65;--a:#F08C66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:16px 16px calc(88px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.3px}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:22px 2px 8px;display:flex;align-items:center;gap:6px}
h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--p)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.muted{color:var(--ink3);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px 16px;color:var(--p-ink);box-shadow:var(--shadow);background:linear-gradient(135deg,var(--hero1),var(--hero2));margin-top:14px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:160px;height:160px;right:-46px;top:-66px;background:rgba(255,255,255,.28)}
.hero::after{width:90px;height:90px;right:52px;bottom:-50px;background:color-mix(in srgb,var(--a) 40%,transparent)}
.hero .lab{font-size:12px;font-weight:600;opacity:.85}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin:2px 0 10px;color:var(--ink)}
.hero .wchips{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.hero .wchip{background:color-mix(in srgb,var(--card) 78%,transparent);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink)}
.metric{border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.metric .lab{font-size:12px}
.metric .big{font-size:21px;font-weight:700;letter-spacing:-.3px;margin:2px 0;color:var(--ink)}
.metric .sub{font-size:11px;opacity:.9}
.m1{background:var(--p-soft);color:var(--p-ink)}
.m2{background:var(--a-soft);color:var(--a-ink)}
.pill{background:var(--p-soft);color:var(--p-ink);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.mon{display:flex;align-items:center;gap:6px}
.mon button{width:30px;height:30px;border-radius:50%;background:var(--card);font-size:16px;color:var(--ink2);box-shadow:var(--shadow)}
.mon button:disabled{opacity:.35}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.tx .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.plus{color:var(--p)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin:16px 4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
.chip.on{background:var(--p);color:#fff}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--p) 40%,var(--card));min-height:2px}
.bars div.hi{background:var(--a)}
.bars div.today{background:var(--p)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
.mbars{display:flex;align-items:flex-end;gap:10px;height:140px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mbar i{display:block;width:100%;border-radius:8px;background:color-mix(in srgb,var(--p) 34%,var(--card))}
.mbar.cur i{background:var(--p)}
.mbar b{font-size:11px;font-weight:600;color:var(--ink2)}
.mbar span{font-size:11px;color:var(--ink3)}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:6px 0 4px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.sw i{width:38px;height:38px;border-radius:50%;display:block;border:3px solid var(--card);box-shadow:0 0 0 2px transparent;transition:.15s}
.sw button.on i{box-shadow:0 0 0 2px var(--ink)}
.sw button.on{color:var(--ink);font-weight:600}
.tog{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--p)}
.tog.on::after{left:21px}
select{font:inherit;border:0;background:var(--bg);border-radius:10px;padding:6px 10px;color:var(--ink)}
.addbtn{width:100%;margin-top:10px;padding:12px;border-radius:14px;background:var(--p-soft);color:var(--p-ink);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:2px 0}
.tabs .ico{display:flex;padding:3px 16px;border-radius:14px;transition:.2s}
.tabs svg{width:22px;height:22px}
.tabs button.on{color:var(--p-ink);font-weight:600}
.tabs button.on .ico{background:var(--p-soft);color:var(--p)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,10,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:85vh;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cats button{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cats button.on{background:var(--p-soft);color:var(--p-ink);font-weight:600}
.cats button span{font-size:20px}
.inp{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);margin-top:6px}
.inp:disabled{opacity:.6}
.danger{color:var(--danger)}
.btn{width:100%;padding:12px;border-radius:14px;font-weight:600;margin-top:10px}
.btn.pri{background:var(--p);color:#fff}
.btn.soft{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:20px;font-size:13px;z-index:20;white-space:nowrap}
.empty{text-align:center;color:var(--ink3);padding:30px 10px}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--ink2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--p-soft);border-top-color:var(--p);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div><div>Đang mở sổ…</div></div></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheet"></div>
<script>
// Địa chỉ Apps Script của cậu (URL web app, kết thúc bằng /exec)
const API = 'https://script.google.com/macros/s/AKfycbzn-NDXizJbpXZFl3aJ0HGtAflg4j3e3-1J2N5QMRXH1vVpRMx-iQnv15w-YgmraOG_/exec';

// Tên bot, dùng để tạo link mở thẳng app
const BOT = 'Money_tracker_Dylan_bot';
const LINK_NHANH = 'https://t.me/' + BOT + '?startapp';

const tg = window.Telegram && Telegram.WebApp;
let homeStatus = null;        // trạng thái biểu tượng trên màn hình chính
const DEMO = !(tg && tg.initData) && /demo/.test(location.search);
const MAU_CAT = ['#4CC29A','#F28B66','#9A91E6','#F5BC4E','#EB7FA6','#6AA9E8','#8CBF4E','#F2A68A','#5FC9C0','#C9C7BD'];
const MAU = {
  bacha:['#2FA67F','#F08C66','Bạc hà'], dao:['#E57B5C','#3BAA85','Đào'], oaihuong:['#7F73DB','#E9849F','Oải hương'], vangbo:['#D49A2C','#3FA3AD','Vàng bơ'],
  anhdao:['#E06A9E','#7F73DB','Anh đào'], bien:['#4692DC','#F08C66','Biển'], matcha:['#77A645','#E08A60','Matcha'], thanchi:['#5E6A65','#F08C66','Than chì'],
};
const KHAC = { Chi:'Khác', Thu:'Thu khác' };

let D = null;                 // dữ liệu từ Sheet
let tab = 'home';
let thang = khoaThang(Date.now());
let locDm = '';

/* ---------- tiện ích ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function vnd(n){ return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function ngan(n){
  const a = Math.abs(Math.round(n)), d = n < 0 ? '-' : '';
  const g = (x, k) => String(parseFloat(x.toFixed(k))).replace('.', ',');
  if (a < 1000) return d + a + 'đ';
  if (a < 1e6) return d + g(a / 1e3, 1) + 'k';
  return d + g(a / 1e6, 2) + 'tr';
}
function vn(t){ return new Date(t + 7 * 3600e3); }                 // giờ Việt Nam qua UTC
function khoaThang(t){ const d = vn(t); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function khoaNgay(t){ return vn(t).toISOString().slice(0, 10); }
function doiThang(k, b){ const [y, m] = k.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + b, 1)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function tenThang(k){ return 'Tháng ' + Number(k.slice(5)) + '/' + k.slice(0, 4); }
function soNgay(k){ const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function rung(k){ try { tg && tg.HapticFeedback && (k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged()); } catch (e) {} }
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

function gds(){ return D.gd.map(r => ({ id:r[0], t:r[1], thu:r[2] === 1, tien:r[3], dm:r[4], vi:r[5], ghi:r[6], nguon:r[7] })); }
function dmInfo(){
  const m = {}; let i = 0;
  D.danhMuc.forEach(d => m[d.ten] = { emoji:d.emoji, loai:d.loai, mau:(d.ten === KHAC.Chi || d.ten === KHAC.Thu) ? '#B4B2A9' : MAU_CAT[i++ % (MAU_CAT.length - 1)] });
  return m;
}
function tenNgan(g){ const s = String(g.ghi || '').split(' | ')[0].trim() || g.dm; return s; }

/* ---------- gọi Apps Script ---------- */
async function api(params){
  if (DEMO) return demoApi(params);
  const q = new URLSearchParams(Object.assign({}, params, { init: tg.initData }));
  const r = await fetch(API + '?' + q.toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.loi || 'Lỗi không rõ');
  return j.data;
}
async function goi(params, okMsg){
  try { D = await api(params); apDungMau(); ve(); if (okMsg) { rung('ok'); toast(okMsg); } }
  catch (e) { toast('⚠️ ' + e.message); }
}

/* ---------- biểu đồ SVG ---------- */
function donut(parts, size){
  const tong = parts.reduce((a, p) => a + p.v, 0);
  const r = 15.9155, C = 100;
  let off = 25, s = '';
  if (!tong) s = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>`;
  parts.forEach(p => {
    const len = p.v / tong * C;
    s += `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${Math.max(len - 0.6, 0.01)} ${C - Math.max(len - 0.6, 0.01)}" stroke-dashoffset="${off}"/>`;
    off -= len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 42 42" role="img" aria-label="Biểu đồ tròn">${s}
    <text x="21" y="20" text-anchor="middle" font-size="3.4" fill="var(--ink3)">Đã chi</text>
    <text x="21" y="25.5" text-anchor="middle" font-size="5" font-weight="600" fill="var(--ink)">${ngan(tong)}</text></svg>`;
}
function phanDm(list){
  const info = dmInfo(), m = {};
  list.filter(g => !g.thu).forEach(g => m[g.dm] = (m[g.dm] || 0) + g.tien);
  return Object.keys(m).sort((a, b) => m[b] - m[a]).map(k => ({ ten:k, v:m[k], c:(info[k] || {}).mau || '#D3D1C7', emoji:(info[k] || {}).emoji || '•' }));
}
function gopTop(parts, n){
  if (parts.length <= n) return parts;
  const top = parts.slice(0, n - 1), con = parts.slice(n - 1).reduce((a, p) => a + p.v, 0);
  return top.concat([{ ten:'Còn lại', v:con, c:'#D3D1C7', emoji:'⋯' }]);
}

/* ---------- các màn hình ---------- */
function oThang(){
  const ht = khoaThang(Date.now());
  return `<div class="mon"><button data-act="thang" data-b="-1" aria-label="Tháng trước">‹</button>
    <span class="pill">${tenThang(thang)}</span>
    <button data-act="thang" data-b="1" aria-label="Tháng sau" ${thang >= ht ? 'disabled' : ''}>›</button></div>`;
}
function dongGd(g, info){
  const d = info[g.dm] || {};
  return `<div class="tx" data-act="gd" data-id="${esc(g.id)}">
    <div class="ic" style="background:${d.mau ? d.mau + '4D' : 'var(--bg)'}">${esc(d.emoji || '•')}</div>
    <div class="sp"><div class="t">${esc(tenNgan(g))}</div>
    <div class="muted">${esc(g.dm)} · ${new Date(g.t).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Ho_Chi_Minh' })} · ${esc(g.vi)}</div></div>
    <div class="amt ${g.thu ? 'plus' : ''}">${g.thu ? '+' : '−'}${ngan(g.tien)}</div></div>`;
}

function veHome(){
  const all = gds(), info = dmInfo();
  const trong = all.filter(g => khoaThang(g.t) === thang);
  const chi = trong.filter(g => !g.thu).reduce((a, g) => a + g.tien, 0);
  const thu = trong.filter(g => g.thu).reduce((a, g) => a + g.tien, 0);
  const ht = khoaThang(Date.now()), truoc = doiThang(thang, -1);
  const homNay = vn(Date.now()).getUTCDate();
  const chiTruoc = all.filter(g => !g.thu && khoaThang(g.t) === truoc && (thang !== ht || vn(g.t).getUTCDate() <= homNay)).reduce((a, g) => a + g.tien, 0);
  const pt = chiTruoc ? Math.round((chi - chiTruoc) * 100 / chiTruoc) : null;
  const tong = D.vi.reduce((a, v) => a + v.soDu, 0);
  const parts = gopTop(phanDm(trong), 5);
  const gan = all.slice().sort((a, b) => b.t - a.t).slice(0, 5);
  const gio = vn(Date.now()).getUTCHours();
  const chao = gio < 11 ? 'Chào buổi sáng ☀️' : gio < 18 ? 'Chào cậu 🌿' : 'Tối vui nha 🌙';
  return `<div class="row"><h1 class="sp">${chao}</h1>${oThang()}</div>
  <div class="hero"><div class="lab">Số dư hiện có</div><div class="big">${vnd(tong)}</div>
    <div class="wchips">${D.vi.map(v => `<span class="wchip">${esc(v.emoji)} ${esc(v.ten)} · ${ngan(v.soDu)}</span>`).join('')}</div></div>
  <div class="grid2" style="margin-top:10px">
    <div class="metric m2"><div class="lab">Đã chi ${thang === ht ? 'tháng này' : 'T' + Number(thang.slice(5))}</div><div class="big">${ngan(chi)}</div>
      <div class="sub">${pt === null ? 'Chưa có tháng trước để so' : (pt >= 0 ? '↑ ' : '↓ ') + Math.abs(pt) + '% so với ' + (thang === ht ? 'cùng kỳ' : 'tháng trước')}</div></div>
    <div class="metric m1"><div class="lab">Đã thu ${thang === ht ? 'tháng này' : 'T' + Number(thang.slice(5))}</div><div class="big">${ngan(thu)}</div>
      <div class="sub">${thu ? 'Giữ lại được ' + Math.max(0, Math.round((thu - chi) * 100 / thu)) + '%' : 'Chưa có khoản thu'}</div></div>
  </div>
  <h2>Chi theo danh mục</h2>
  <div class="card row" style="gap:16px">${donut(parts, 116)}
    <div class="sp">${parts.length ? parts.map(p => `<div class="lg"><span class="dot" style="background:${p.c}"></span><span class="sp">${esc(p.emoji)} ${esc(p.ten)}</span><b style="font-weight:500">${ngan(p.v)}</b></div>`).join('') : '<div class="muted">Chưa có khoản chi nào 🍃</div>'}</div></div>
  <h2>Gần đây</h2>
  <div class="card" style="padding:4px 14px">${gan.length ? gan.map(g => dongGd(g, info)).join('') : '<div class="empty">Sổ còn trống, nhắn bot <b>50k cafe</b> thử nha</div>'}</div>`;
}

function veGd(){
  const info = dmInfo();
  let list = gds().filter(g => khoaThang(g.t) === thang).sort((a, b) => b.t - a.t);
  const dms = [...new Set(list.map(g => g.dm))];
  if (locDm && !dms.includes(locDm)) locDm = '';
  if (locDm) list = list.filter(g => g.dm === locDm);
  const theoNgay = {};
  list.forEach(g => (theoNgay[khoaNgay(g.t)] = theoNgay[khoaNgay(g.t)] || []).push(g));
  const tongChi = list.filter(g => !g.thu).reduce((a, g) => a + g.tien, 0);
  const tongThu = list.filter(g => g.thu).reduce((a, g) => a + g.tien, 0);
  return `<div class="row"><h1 class="sp">Giao dịch</h1>${oThang()}</div>
  <div class="chips" style="margin-top:12px"><button class="chip ${locDm ? '' : 'on'}" data-act="loc" data-dm="">Tất cả</button>
    ${dms.map(k => `<button class="chip ${locDm === k ? 'on' : ''}" data-act="loc" data-dm="${esc(k)}">${esc((info[k] || {}).emoji || '•')} ${esc(k)}</button>`).join('')}</div>
  <div class="grid2" style="margin-top:10px">
    <div class="metric m2"><div class="lab">Chi</div><div class="big" style="font-size:18px">${ngan(tongChi)}</div></div>
    <div class="metric m1"><div class="lab">Thu</div><div class="big" style="font-size:18px">${ngan(tongThu)}</div></div></div>
  ${Object.keys(theoNgay).length ? Object.keys(theoNgay).map(k => {
    const ds = theoNgay[k], c = ds.filter(g => !g.thu).reduce((a, g) => a + g.tien, 0);
    const [y, m, d] = k.split('-');
    return `<div class="day"><span>${d}/${m}</span><span>${c ? '−' + ngan(c) : ''}</span></div>
      <div class="card" style="padding:4px 14px">${ds.map(g => dongGd(g, info)).join('')}</div>`;
  }).join('') : '<div class="empty">Tháng này chưa có khoản nào 🍃</div>'}`;
}

function veBieuDo(){
  const all = gds(), trong = all.filter(g => khoaThang(g.t) === thang);
  const parts = phanDm(trong), tongChi = parts.reduce((a, p) => a + p.v, 0);
  const n = soNgay(thang), ngay = Array(n).fill(0);
  trong.filter(g => !g.thu).forEach(g => ngay[vn(g.t).getUTCDate() - 1] += g.tien);
  const max = Math.max(...ngay, 1), imax = ngay.indexOf(Math.max(...ngay));
  const laHT = thang === khoaThang(Date.now()), hn = vn(Date.now()).getUTCDate() - 1;
  const thangs = [5, 4, 3, 2, 1, 0].map(b => doiThang(thang, -b));
  const tongT = thangs.map(k => all.filter(g => !g.thu && khoaThang(g.t) === k).reduce((a, g) => a + g.tien, 0));
  const maxT = Math.max(...tongT, 1);
  const tb = tongT.filter(x => x).length ? tongT.reduce((a, b) => a + b, 0) / tongT.filter(x => x).length : 0;
  return `<div class="row"><h1 class="sp">Biểu đồ</h1>${oThang()}</div>
  <h2>Chi theo danh mục</h2>
  <div class="card"><div style="display:flex;justify-content:center">${donut(parts, 170)}</div>
    <div style="margin-top:10px">${parts.length ? parts.map(p => `<div class="lg"><span class="dot" style="background:${p.c}"></span><span class="sp">${esc(p.emoji)} ${esc(p.ten)}</span><span class="muted">${Math.round(p.v * 100 / tongChi)}%</span>&nbsp;<b style="font-weight:500;min-width:58px;text-align:right">${ngan(p.v)}</b></div>`).join('') : '<div class="muted">Chưa có khoản chi nào 🍃</div>'}</div></div>
  <h2>Chi từng ngày</h2>
  <div class="card"><div class="bars">${ngay.map((v, i) => `<div class="${v && i === imax ? 'hi' : laHT && i === hn ? 'today' : ''}" style="height:${v ? Math.max(v / max * 100, 3) : 1.5}%" title="${i + 1}: ${ngan(v)}"></div>`).join('')}</div>
    <div class="axis"><span>1</span><span>${Math.ceil(n / 2)}</span><span>${n}</span></div>
    <div class="muted" style="margin-top:6px">${ngay[imax] ? 'Tiêu nhiều nhất ngày ' + (imax + 1) + ': ' + ngan(ngay[imax]) : 'Chưa có khoản chi nào'}</div></div>
  <h2>Xu hướng 6 tháng</h2>
  <div class="card"><div class="mbars">${thangs.map((k, i) => `<div class="mbar ${k === thang ? 'cur' : ''}"><b>${tongT[i] ? ngan(tongT[i]) : ''}</b><i style="height:${tongT[i] ? Math.max(tongT[i] / maxT * 100, 4) : 2}%"></i><span>T${Number(k.slice(5))}</span></div>`).join('')}</div>
    <div class="muted" style="margin-top:8px">Trung bình ${ngan(tb)}/tháng</div></div>`;
}

function veCaiDat(){
  const cd = D.caiDat, mau = cd.mau || 'bacha', lay = String(cd.do_lay), gio = Number(cd.gio_bao_toi), cheDo = cd.che_do || 'tudong';
  const nhom = l => D.danhMuc.filter(d => d.loai === l);
  const dsDm = l => nhom(l).map(d => `<div class="set" data-act="dm" data-ten="${esc(d.ten)}"><div class="ic" style="background:var(--bg)">${esc(d.emoji)}</div><span class="sp">${esc(d.ten)}</span><span class="muted">›</span></div>`).join('');
  let nhanh;
  if (homeStatus === 'added') nhanh = `<div class="set"><span class="sp">✅ Đã có biểu tượng trên màn hình chính</span></div>`;
  else if (homeStatus === 'missed' || homeStatus === 'unknown') nhanh = `<div class="set"><div class="sp">Thêm vào màn hình chính<div class="muted">Bấm biểu tượng là vào thẳng app</div></div><button class="pill" data-act="home">📲 Thêm</button></div>`;
  else nhanh = `<div class="set"><div class="sp">Link mở thẳng app<div class="muted">Dán vào app Phím tắt của iPhone để tạo biểu tượng</div></div><button class="pill" data-act="copy">📋 Sao chép</button></div>`;
  return `<h1>Tùy chỉnh</h1>
  <h2>Mở nhanh</h2>
  <div class="card">${nhanh}</div>
  <h2>Giao diện</h2>
  <div class="card">
    <div class="sw">${Object.keys(MAU).map(k => `<button class="${k === mau ? 'on' : ''}" data-act="mau" data-k="${k}"><i style="background:linear-gradient(135deg,${MAU[k][0]} 55%,${MAU[k][1]} 55%)"></i>${MAU[k][2]}</button>`).join('')}</div>
    <div class="set" style="border-top:1px solid var(--line);margin-top:8px"><span class="sp">Nền</span><div class="seg">${[['tudong','Tự động'],['sang','Sáng'],['toi','Tối']].map(x => `<button class="${x[0] === cheDo ? 'on' : ''}" data-act="chedo" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
  </div>
  <h2>Bot Telegram</h2>
  <div class="card">
    <div class="set"><span class="sp">Giờ tổng kết tối</span><select data-act="gio">${Array.from({ length:24 }, (_, h) => `<option value="${h}" ${h === gio ? 'selected' : ''}>${h}:00</option>`).join('')}</select></div>
    <div class="set"><span class="sp">Độ lầy</span><div class="seg">${[['0','Nghiêm túc'],['1','Vừa'],['2','Lầy']].map(x => `<button class="${x[0] === lay ? 'on' : ''}" data-act="lay" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
    <div class="set"><div class="sp">Báo ngay khoản từ Gmail<div class="muted">Tắt thì gom vào tổng kết tối</div></div><button class="tog ${String(cd.bao_gmail_ngay).toUpperCase() === 'CO' ? 'on' : ''}" data-act="gmail" aria-label="Báo ngay khoản từ Gmail"></button></div>
  </div>
  <h2>Danh mục chi</h2><div class="card" style="padding:2px 14px">${dsDm('Chi')}</div>
  <button class="addbtn" data-act="dmmoi" data-loai="Chi">＋ Thêm danh mục chi</button>
  <h2>Danh mục thu</h2><div class="card" style="padding:2px 14px">${dsDm('Thu')}</div>
  <button class="addbtn" data-act="dmmoi" data-loai="Thu">＋ Thêm danh mục thu</button>
  <div class="muted" style="text-align:center;margin-top:20px">Dữ liệu nằm trong Google Sheet của cậu 🌿</div>`;
}

/* ---------- bảng trượt ---------- */
function moSheet(html){ document.getElementById('sheet').innerHTML = `<div class="sheet-bg" data-act="dong"><div class="sheet"><div class="grab"></div>${html}</div></div>`; }
function dongSheet(){ document.getElementById('sheet').innerHTML = ''; }

function sheetGd(id){
  const g = gds().find(x => x.id === id); if (!g) return;
  const info = dmInfo();
  const ds = D.danhMuc.filter(d => d.loai === (g.thu ? 'Thu' : 'Chi'));
  moSheet(`<div class="row"><div class="ic" style="background:var(--bg)">${esc((info[g.dm] || {}).emoji || '•')}</div>
    <div class="sp"><b style="font-weight:600">${esc(tenNgan(g))}</b><div class="muted">${new Date(g.t).toLocaleString('vi-VN', { timeZone:'Asia/Ho_Chi_Minh' })} · ${esc(g.vi)} · ${esc(g.nguon)}</div></div>
    <div class="amt ${g.thu ? 'plus' : ''}" style="font-size:18px">${g.thu ? '+' : '−'}${vnd(g.tien)}</div></div>
    ${g.ghi && g.ghi !== tenNgan(g) ? `<div class="muted" style="margin-top:8px">${esc(g.ghi)}</div>` : ''}
    <h2>Danh mục</h2>
    <div class="cats">${ds.map(d => `<button class="${d.ten === g.dm ? 'on' : ''}" data-act="doidm" data-id="${esc(g.id)}" data-ten="${esc(d.ten)}"><span>${esc(d.emoji)}</span>${esc(d.ten)}</button>`).join('')}</div>
    <button class="btn soft danger" data-act="xoa" data-id="${esc(g.id)}">Xóa khoản này</button>`);
}

function sheetDm(ten, loai){
  const d = ten ? D.danhMuc.find(x => x.ten === ten) : { ten:'', emoji:'', loai };
  if (!d) return;
  const macDinh = d.ten === KHAC.Chi || d.ten === KHAC.Thu;
  moSheet(`<b style="font-weight:600;font-size:17px">${ten ? 'Sửa danh mục' : 'Danh mục ' + (loai === 'Thu' ? 'thu' : 'chi') + ' mới'}</b>
    <div class="muted" style="margin-top:12px">Emoji</div><input class="inp" id="dmEmoji" maxlength="8" value="${esc(d.emoji)}" placeholder="🍵">
    <div class="muted" style="margin-top:10px">Tên</div><input class="inp" id="dmTen" maxlength="30" value="${esc(d.ten)}" placeholder="Trà sữa" ${macDinh ? 'disabled' : ''}>
    <button class="btn pri" data-act="dmluu" data-cu="${esc(d.ten)}" data-loai="${esc(d.loai)}">Lưu</button>
    ${ten && !macDinh ? `<button class="btn soft danger" data-act="dmxoa" data-ten="${esc(d.ten)}">Xóa danh mục</button><div class="muted" style="text-align:center;margin-top:6px">Các khoản cũ sẽ chuyển về “${d.loai === 'Thu' ? KHAC.Thu : KHAC.Chi}”</div>` : ''}`);
}

function xacNhan(text, cb){ if (tg && tg.showConfirm && !DEMO) tg.showConfirm(text, ok => ok && cb()); else if (confirm(text)) cb(); }

/* ---------- vẽ và sự kiện ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  gd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  bd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>',
  cd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
function ve(){
  const v = { home:veHome, gd:veGd, bd:veBieuDo, cd:veCaiDat }[tab];
  document.getElementById('app').innerHTML = v();
  const t = document.getElementById('tabs');
  t.hidden = false;
  t.innerHTML = [['home','Tổng quan'],['gd','Giao dịch'],['bd','Biểu đồ'],['cd','Tùy chỉnh']].map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-act="tab" data-t="${x[0]}"><span class="ico">${ICON[x[0]]}</span>${x[1]}</button>`).join('');
}
function laNenToi(){
  const cheDo = (D && D.caiDat.che_do) || 'tudong';
  if (cheDo === 'toi') return true;
  if (cheDo === 'sang') return false;
  if (tg && tg.initData) return tg.colorScheme === 'dark';
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function apDungMau(){
  const m = (D && D.caiDat.mau) || 'bacha';
  document.documentElement.dataset.mau = m;
  document.documentElement.dataset.theme = laNenToi() ? 'dark' : 'light';
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); tg && tg.setBottomBarColor && tg.setBottomBarColor(getComputedStyle(document.documentElement).getPropertyValue('--card').trim()); } catch (e) {}
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tab') { tab = el.dataset.t; rung(); ve(); scrollTo(0, 0); }
  else if (a === 'thang') { thang = doiThang(thang, Number(el.dataset.b)); rung(); ve(); }
  else if (a === 'loc') { locDm = el.dataset.dm; rung(); ve(); }
  else if (a === 'gd') { rung(); sheetGd(el.dataset.id); }
  else if (a === 'dong') { if (e.target === el) dongSheet(); }
  else if (a === 'doidm') { dongSheet(); goi({ api:'dm', id:el.dataset.id, ten:el.dataset.ten }, 'Đã đổi danh mục'); }
  else if (a === 'xoa') xacNhan('Xóa khoản này khỏi sổ?', () => { dongSheet(); goi({ api:'xoa', id:el.dataset.id }, 'Đã xóa'); });
  else if (a === 'mau') { D.caiDat.mau = el.dataset.k; apDungMau(); ve(); goi({ api:'caidat', khoa:'mau', gt:el.dataset.k }, 'Đã đổi màu'); }
  else if (a === 'chedo') { D.caiDat.che_do = el.dataset.v; apDungMau(); ve(); goi({ api:'caidat', khoa:'che_do', gt:el.dataset.v }, 'Đã đổi nền'); }
  else if (a === 'lay') goi({ api:'caidat', khoa:'do_lay', gt:el.dataset.v }, 'Đã lưu');
  else if (a === 'gmail') goi({ api:'caidat', khoa:'bao_gmail_ngay', gt:el.classList.contains('on') ? 'KHONG' : 'CO' }, 'Đã lưu');
  else if (a === 'dm') { rung(); sheetDm(el.dataset.ten); }
  else if (a === 'dmmoi') { rung(); sheetDm('', el.dataset.loai); }
  else if (a === 'dmluu') {
    const ten = document.getElementById('dmTen').value.trim(), emoji = document.getElementById('dmEmoji').value.trim();
    if (!ten) return toast('Cậu đặt tên cho danh mục nha');
    dongSheet(); goi({ api:'dmluu', cu:el.dataset.cu, ten, emoji, loai:el.dataset.loai }, 'Đã lưu danh mục');
  }
  else if (a === 'home') { try { tg.addToHomeScreen(); } catch (err) { toast('Telegram này chưa hỗ trợ, dùng link nha'); } }
  else if (a === 'copy') {
    const xong = () => { rung('ok'); toast('Đã sao chép link'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(LINK_NHANH).then(xong, () => prompt('Sao chép link này:', LINK_NHANH));
    else prompt('Sao chép link này:', LINK_NHANH);
  }
  else if (a === 'dmxoa') xacNhan('Xóa danh mục “' + el.dataset.ten + '”?', () => { dongSheet(); goi({ api:'dmxoa', ten:el.dataset.ten }, 'Đã xóa danh mục'); });
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'gio') goi({ api:'caidat', khoa:'gio_bao_toi', gt:e.target.value }, 'Đã lưu giờ tổng kết');
});

/* ---------- khởi động ---------- */
async function batDau(){
  apDungMau();
  try { tg && tg.onEvent && tg.onEvent('themeChanged', apDungMau); } catch (e) {}
  try { window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apDungMau); } catch (e) {}
  if (tg) {
    tg.ready(); tg.expand();
    try {
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.checkHomeScreenStatus) {
        tg.checkHomeScreenStatus(st => { homeStatus = st; if (D && tab === 'cd') ve(); });
        tg.onEvent('homeScreenAdded', () => { homeStatus = 'added'; toast('Đã thêm vào màn hình chính 🎉'); if (D && tab === 'cd') ve(); });
      }
    } catch (e) {}
  }
  if (!DEMO && !(tg && tg.initData)) {
    document.getElementById('app').innerHTML = '<div class="center"><div style="font-size:34px">🌿</div><b>Mở app từ bot Telegram nha</b><div class="muted">Trang này chỉ chạy bên trong Telegram để giữ dữ liệu của cậu an toàn.</div></div>';
    return;
  }
  try { D = await api({ api:'data' }); apDungMau(); ve(); }
  catch (e) { document.getElementById('app').innerHTML = `<div class="center"><div style="font-size:34px">🥲</div><b>Chưa mở được sổ</b><div class="muted">${esc(e.message)}</div><button class="btn pri" style="width:auto;padding:10px 20px" onclick="location.reload()">Thử lại</button></div>`; }
}

/* ---------- dữ liệu mẫu để xem thử ngoài Telegram (?demo) ---------- */
function demoApi(p){
  if (!window._demo) {
    const now = Date.now(), H = 3600e3, mk = (d, h, thu, tien, dm, vi, ghi, ng) => ['x' + Math.random().toString(36).slice(2, 8), now - d * 24 * H - h * H, thu, tien, dm, vi, ghi, ng];
    const gd = [];
    const mau = [['Ăn uống','CTY TNHH MINISTOP VN HCM VN',22000],['Ăn uống','cafe',45000],['Đi lại','CONG TY TNHH LE HONG THU | TT Nhien lieu',80000],['Mua sắm','shopee',150000],['Hóa đơn','TOPUP Viettel 0963992146 30000',30000],['Ăn uống','BURGER CARLS JR HCM VN',198000],['Giải trí','netflix',260000],['Đi lại','gửi xe',5000]];
    for (let d = 0; d < 170; d++) { const k = 1 + (d * 7) % 3; for (let j = 0; j < k; j++) { const m = mau[(d * 3 + j * 5) % mau.length]; gd.push(mk(d, 2 + j * 3, 0, m[2] * (1 + (d % 4) * 0.25), m[0], j % 4 === 3 ? 'Tiền mặt' : 'VCB', m[1], j ? 'Tay' : 'Gmail')); } }
    for (let mo = 0; mo < 6; mo++) gd.push(mk(mo * 30 + 4, 1, 1, 15000000, 'Lương', 'VCB', 'lương', 'Tay'));
    gd.push(mk(1, 5, 1, 1200000, 'Affiliate', 'VCB', 'affiliate shopee', 'Tay'));
    gd.push(mk(0, 1, 0, 37000, 'Khác', 'VCB', 'NGUYEN VAN A | chuyen tien', 'Gmail'));
    window._demo = {
      vi:[{ ten:'VCB', emoji:'🏦', soDu:4908000 }, { ten:'Tiền mặt', emoji:'💵', soDu:300000 }],
      danhMuc:[['Ăn uống','Chi','🍜'],['Đi lại','Chi','🛵'],['Mua sắm','Chi','🛍'],['Hóa đơn','Chi','🧾'],['Giải trí','Chi','🎮'],['Sức khỏe','Chi','💊'],['Học tập','Chi','📚'],['Gia đình','Chi','🏠'],['Hiếu hỉ & quà','Chi','🎁'],['Chuyển khoản','Chi','🔁'],['Khác','Chi','📦'],['Lương','Thu','💼'],['Affiliate','Thu','🔗'],['Thưởng','Thu','🎉'],['Thu khác','Thu','💰']].map(x => ({ ten:x[0], loai:x[1], emoji:x[2] })),
      caiDat:{ gio_bao_toi:21, do_lay:1, bao_gmail_ngay:'KHONG', mau:(location.search.match(/mau=(\w+)/) || [])[1] || 'bacha', che_do:(location.search.match(/mode=(\w+)/) || [])[1] || 'tudong' },
      gd,
    };
  }
  const X = window._demo;
  if (p.api === 'dm') X.gd.find(r => r[0] === p.id)[4] = p.ten;
  if (p.api === 'xoa') X.gd = X.gd.filter(r => r[0] !== p.id);
  if (p.api === 'caidat') X.caiDat[p.khoa] = p.gt;
  if (p.api === 'dmluu') { const d = X.danhMuc.find(x => x.ten === p.cu); if (d) { X.gd.forEach(r => r[4] === p.cu && (r[4] = p.ten)); d.ten = p.ten; d.emoji = p.emoji; } else X.danhMuc.push({ ten:p.ten, emoji:p.emoji || '•', loai:p.loai }); }
  if (p.api === 'dmxoa') { const d = X.danhMuc.find(x => x.ten === p.ten); X.gd.forEach(r => r[4] === p.ten && (r[4] = KHAC[d.loai])); X.danhMuc = X.danhMuc.filter(x => x.ten !== p.ten); }
  if (/tab=(\w+)/.test(location.search) && !window._tabSet) { window._tabSet = 1; tab = location.search.match(/tab=(\w+)/)[1]; }
  return Promise.resolve(JSON.parse(JSON.stringify(X)));
}

batDau();
</script>
