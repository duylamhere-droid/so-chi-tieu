<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sổ chi tiêu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --acc:#1D9E75;
  --bg:#FFF7EC;--card:#FFFFFF;--ink:#2B2622;--ink2:#5C534B;--ink3:#948A80;--line:#EFE3D2;--soft:#FBF0E1;
  --up:#D2553F;--down:#1D9E75;--danger:#B3352F;--edge:#2B2622;
  --peach:#FFD6A5;--pink:#FFC2CF;--mint:#BDEBD9;
  --r:18px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1A1714;--card:#25201B;--ink:#F5EDE2;--ink2:#C9BFB3;--ink3:#968B80;--line:#3A332C;--soft:#2F2923;
  --up:#F08A75;--down:#5CCB9F;--danger:#F0857D;--edge:#000000;
  --peach:#8A6440;--pink:#8A4A5A;--mint:#3E6E5D;color-scheme:dark;
}
:root[data-mau="dao"]{--acc:#E0715A}
:root[data-mau="oaihuong"]{--acc:#6F66D6}
:root[data-mau="vangbo"]{--acc:#C9901F}
:root[data-mau="anhdao"]{--acc:#D9578F}
:root[data-mau="bien"]{--acc:#2F80D1}
:root[data-mau="matcha"]{--acc:#6A9A3A}
:root[data-mau="thanchi"]{--acc:#55554F}
:root[data-theme="dark"][data-mau="thanchi"]{--acc:#C9C8C2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:18px 18px calc(86px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.4px}
h2{font-size:12px;font-weight:500;color:var(--ink3);margin:24px 2px 8px;letter-spacing:.5px;text-transform:uppercase}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.stk{position:relative;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);border-radius:20px;padding:14px 16px;color:var(--ink)}
.stk .cat{position:absolute;right:12px;top:10px;line-height:0}
.stk .lb{font-size:12px;font-weight:600}
.stk .bg{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin:2px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.duo .stk{padding:10px 12px;border-radius:16px}
.duo .bg{font-size:20px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.muted{color:var(--ink3);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between}
.hello{font-size:15px;color:var(--ink2)}
.mon{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:20px;padding:2px;border:2px solid var(--edge)}
.mon button{width:28px;height:28px;border-radius:50%;font-size:15px;color:var(--ink2)}
.mon button:disabled{opacity:.3}
.mon span{font-size:13px;font-weight:500;padding:0 6px}
.cap{font-size:11px;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;font-weight:500}
.big{font-size:40px;font-weight:600;letter-spacing:-1.4px;line-height:1.1;margin:4px 0 2px}
.big small{font-size:20px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:2px}
.delta{font-size:13px;font-weight:500}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.wallets{font-size:13px;color:var(--ink2);margin-top:6px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--soft)}
.stack i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.lg .pc{color:var(--ink3);font-size:12px;width:36px;text-align:right}
.lg b{font-weight:500;min-width:64px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:10px}
.sum b{color:var(--ink);font-weight:500;font-size:15px}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.foot b{color:var(--ink);font-weight:500}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line)}
.tx:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--soft)}
.tx .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.amt{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.plus{color:var(--down)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin:18px 4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chip{border:1.5px solid var(--edge)}
.chip.on{background:var(--peach);color:var(--ink);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}
.bars div{flex:1;border-radius:3px;background:var(--soft);min-height:2px}
.bars div.v{background:color-mix(in srgb,var(--ink) 22%,var(--card))}
.bars div.hi{background:var(--acc)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
.mbars{display:flex;align-items:flex-end;gap:12px;height:130px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mbar i{display:block;width:100%;border-radius:6px;background:color-mix(in srgb,var(--ink) 14%,var(--card))}
.mbar.cur i{background:var(--acc)}
.mbar b{font-size:11px;font-weight:500;color:var(--ink2)}
.mbar span{font-size:11px;color:var(--ink3)}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.set:last-child{border-bottom:0}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{padding:5px 10px;border-radius:8px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:8px 0}
.sw button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink3)}
.sw i{width:30px;height:30px;border-radius:50%;display:block;outline:2px solid transparent;outline-offset:3px}
.sw button.on i{outline-color:var(--ink)}
.sw button.on{color:var(--ink);font-weight:500}
.tog{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--acc)}
.tog.on::after{left:21px}
select{font:inherit;border:0;background:var(--soft);border-radius:10px;padding:5px 10px;color:var(--ink)}
.addbtn{width:100%;margin-top:12px;padding:12px;border-radius:14px;background:var(--card);color:var(--ink);font-weight:600;font-size:14px;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.pill{background:var(--soft);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3)}
.tabs .ico{display:flex}
.tabs svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:500}
.tabs button.on .ico{color:var(--acc)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,10,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:85vh;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cats button{background:var(--soft);border-radius:12px;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2)}
.cats button.on{background:var(--ink);color:var(--card);font-weight:500}
.cats button span{font-size:19px}
.inp{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);color:var(--ink);margin-top:6px}
.inp:disabled{opacity:.6}
.danger{color:var(--danger)}
.btn{width:100%;padding:13px;border-radius:14px;font-weight:500;margin-top:10px}
.btn.pri{background:var(--peach);color:var(--ink);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.btn.soft{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:20px;font-size:13px;z-index:20;white-space:nowrap}
.empty{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--ink2)}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div><svg width="48" height="48" viewBox="0 0 24 24" fill="#9FD9A8" stroke="#2B2622" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"/><path d="M5 19l8-8" fill="none"/></svg></div><div class="spin"></div><div>Đang mở sổ…</div></div></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheet"></div>
<script>
// Địa chỉ Apps Script của cậu (URL web app, kết thúc bằng /exec)
const API = 'https://script.google.com/macros/s/AKfycbzn-NDXizJbpXZFl3aJ0HGtAflg4j3e3-1J2N5QMRXH1vVpRMx-iQnv15w-YgmraOG_/exec';

// Tên bot, dùng để tạo link mở thẳng app
const BOT = 'Money_tracker_Dylan_bot';
const LINK_NHANH = 'https://t.me/' + BOT + '?startapp';

const tg = window.Telegram && Telegram.WebApp;
let homeStatus = null;        // trạng thái biểu tượng trên màn hình chính
const DEMO = !(tg && tg.initData) && /demo/.test(location.search);
const MAU_CAT = ['#E8836B','#7C83E8','#4CC29A','#E9B949','#D987B5','#5FA8D3','#9BBF6A','#E8A87C','#6CC3BE'];
const MAU = {
  bacha:['#1D9E75','Bạc hà'], dao:['#E0715A','Đào'], oaihuong:['#6F66D6','Oải hương'], vangbo:['#C9901F','Vàng bơ'],
  anhdao:['#D9578F','Anh đào'], bien:['#2F80D1','Biển'], matcha:['#6A9A3A','Matcha'], thanchi:['#55554F','Than chì'],
};
const KHAC = { Chi:'Khác', Thu:'Thu khác' };

let D = null;                 // dữ liệu từ Sheet
let tab = 'home';
let thang = khoaThang(Date.now());
let locDm = '';

/* ---------- tiện ích ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function vnd(n){ return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function ngan(n){
  const a = Math.abs(Math.round(n)), d = n < 0 ? '-' : '';
  const g = (x, k) => String(parseFloat(x.toFixed(k))).replace('.', ',');
  if (a < 1000) return d + a + 'đ';
  if (a < 1e6) return d + g(a / 1e3, 1) + 'k';
  return d + g(a / 1e6, 2) + 'tr';
}
function vn(t){ return new Date(t + 7 * 3600e3); }                 // giờ Việt Nam qua UTC
function khoaThang(t){ const d = vn(t); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function khoaNgay(t){ return vn(t).toISOString().slice(0, 10); }
function doiThang(k, b){ const [y, m] = k.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + b, 1)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function tenThang(k){ return 'Tháng ' + Number(k.slice(5)) + '/' + k.slice(0, 4); }
function soNgay(k){ const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function rung(k){ try { tg && tg.HapticFeedback && (k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged()); } catch (e) {} }
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

function gds(){ return D.gd.map(r => ({ id:r[0], t:r[1], thu:r[2] === 1, tien:r[3], dm:r[4], vi:r[5], ghi:r[6], nguon:r[7] })); }
function dmInfo(){
  const m = {}; let i = 0;
  D.danhMuc.forEach(d => m[d.ten] = { emoji:d.emoji, loai:d.loai, mau:(d.ten === KHAC.Chi || d.ten === KHAC.Thu) ? '#BDBAB0' : MAU_CAT[i++ % MAU_CAT.length] });
  return m;
}
function tenNgan(g){ const s = String(g.ghi || '').split(' | ')[0].trim() || g.dm; return s; }

/* ---------- gọi Apps Script ---------- */
async function api(params){
  if (DEMO) return demoApi(params);
  const q = new URLSearchParams(Object.assign({}, params, { init: tg.initData }));
  const r = await fetch(API + '?' + q.toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.loi || 'Lỗi không rõ');
  return j.data;
}
async function goi(params, okMsg){
  try { D = await api(params); apDungMau(); ve(); if (okMsg) { rung('ok'); toast(okMsg); } }
  catch (e) { toast('⚠️ ' + e.message); }
}

/* ---------- biểu đồ SVG ---------- */
function donut(parts, size){
  const tong = parts.reduce((a, p) => a + p.v, 0);
  const r = 15.9155, C = 100;
  let off = 25, s = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--soft)" stroke-width="3.2"/>`;
  parts.forEach(p => {
    const len = p.v / tong * C, l = Math.max(len - 0.8, 0.01);
    s += `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${p.c}" stroke-width="3.2" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${off}"/>`;
    off -= len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 42 42" role="img" aria-label="Biểu đồ tròn">${s}
    <text x="21" y="19.5" text-anchor="middle" font-size="3" fill="var(--ink3)" letter-spacing=".2">ĐÃ CHI</text>
    <text x="21" y="25.5" text-anchor="middle" font-size="5.4" font-weight="600" fill="var(--ink)">${ngan(tong)}</text></svg>`;
}
function stack(parts){
  const tong = parts.reduce((a, p) => a + p.v, 0);
  return `<div class="stack">${tong ? parts.map(p => `<i style="flex:${p.v};background:${p.c}"></i>`).join('') : ''}</div>`;
}
function dongLg(p, tong){
  return `<div class="lg"><span class="dot" style="background:${p.c}"></span><span class="sp">${esc(p.ten)}</span><span class="pc">${tong ? Math.round(p.v * 100 / tong) + '%' : ''}</span><b class="num">${ngan(p.v)}</b></div>`;
}
function phanDm(list){
  const info = dmInfo(), m = {};
  list.filter(g => !g.thu).forEach(g => m[g.dm] = (m[g.dm] || 0) + g.tien);
  return Object.keys(m).sort((a, b) => m[b] - m[a]).map(k => ({ ten:k, v:m[k], c:(info[k] || {}).mau || '#D3D1C7', emoji:(info[k] || {}).emoji || '•' }));
}
function gopTop(parts, n){
  if (parts.length <= n) return parts;
  const top = parts.slice(0, n - 1), con = parts.slice(n - 1).reduce((a, p) => a + p.v, 0);
  return top.concat([{ ten:'Còn lại', v:con, c:'#D3D1C7', emoji:'⋯' }]);
}

/* ---------- các màn hình ---------- */
function oThang(){
  const ht = khoaThang(Date.now());
  return `<div class="mon"><button data-act="thang" data-b="-1" aria-label="Tháng trước">‹</button>
    <span>Tháng ${Number(thang.slice(5))}</span>
    <button data-act="thang" data-b="1" aria-label="Tháng sau" ${thang >= ht ? 'disabled' : ''}>›</button></div>`;
}
function dongGd(g, info){
  const d = info[g.dm] || {};
  return `<div class="tx" data-act="gd" data-id="${esc(g.id)}">
    <div class="ic">${esc(d.emoji || '•')}</div>
    <div class="sp"><div class="t">${esc(tenNgan(g))}</div>
    <div class="muted">${esc(g.dm)} · ${new Date(g.t).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Ho_Chi_Minh' })}</div></div>
    <div class="amt ${g.thu ? 'plus' : ''}">${g.thu ? '+' : '−'}${ngan(g.tien)}</div></div>`;
}

function veHome(){
  const all = gds(), info = dmInfo();
  const trong = all.filter(g => khoaThang(g.t) === thang);
  const chi = trong.filter(g => !g.thu).reduce((a, g) => a + g.tien, 0);
  const thu = trong.filter(g => g.thu).reduce((a, g) => a + g.tien, 0);
  const ht = khoaThang(Date.now()), truoc = doiThang(thang, -1);
  const homNay = vn(Date.now()).getUTCDate();
  const chiTruoc = all.filter(g => !g.thu && khoaThang(g.t) === truoc && (thang !== ht || vn(g.t).getUTCDate() <= homNay)).reduce((a, g) => a + g.tien, 0);
  const pt = chiTruoc ? Math.round((chi - chiTruoc) * 100 / chiTruoc) : null;
  const tong = D.vi.reduce((a, v) => a + v.soDu, 0);
  const top = gopTop(phanDm(trong), 5);
  const gan = all.slice().sort((a, b) => b.t - a.t).slice(0, 5);
  const gio = vn(Date.now()).getUTCHours();
  const chao = gio < 11 ? 'Chào buổi sáng ☀️' : gio < 18 ? 'Chào cậu 🌿' : 'Tối vui nha 🌙';
  const so = vnd(tong).replace('đ', '');
  return `<div class="top"><span class="hello">${chao}</span>${oThang()}</div>
  <div class="stk" style="background:var(--peach);margin-top:18px">
    <div class="cat"><svg width="38" height="38" viewBox="0 0 24 24" fill="#9FD9A8" stroke="#2B2622" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"/><path d="M5 19l8-8" fill="none"/></svg></div>
    <div class="lb">Ví của cậu</div>
    <div class="bg num">${so}<span style="font-size:18px">đ</span></div>
    <div style="font-size:12px">${D.vi.map(v => esc(v.emoji + ' ' + ngan(v.soDu))).join(' · ')}</div>
  </div>
  <div class="duo">
    <div class="stk" style="background:var(--pink)"><div class="lb">Đã chi 💸</div><div class="bg num">${ngan(chi)}</div>
      <div style="font-size:11px">${pt === null ? 'tháng này' : (pt > 0 ? '↑ ' : '↓ ') + Math.abs(pt) + '% so cùng kỳ'}</div></div>
    <div class="stk" style="background:var(--mint)"><div class="lb">Đã thu 🌱</div><div class="bg num">${ngan(thu)}</div>
      <div style="font-size:11px">${thu ? 'giữ lại ' + Math.max(0, Math.round((thu - chi) * 100 / thu)) + '%' : 'tháng này'}</div></div>
  </div>
  <h2>Chi theo danh mục</h2>
  <div class="card">
    <div class="sum"><span>${tenThang(thang)} · đã chi</span><b class="num">${vnd(chi)}</b></div>

function veGd(){

  const theoNgay = {};
  list.forEach(g => (theoNgay[khoaNgay(g.t)] = theoNgay[khoaNgay(g.t)] || []).push(g));
  const tongChi = list.filter(g => !g.thu).reduce((a, g) => a + g.tien, 0);
  const tongThu = list.filter(g => g.thu).reduce((a, g) => a + g.tien, 0);
  const thuTuan = ['CN','T2','T3','T4','T5','T6','T7'];
  return `<div class="top"><h1>Giao dịch</h1>${oThang()}</div>
  <div class="row" style="margin:16px 2px 12px;gap:24px">

    const [y, m, d] = k.split('-');
    const w = thuTuan[new Date(Date.UTC(+y, +m - 1, +d)).getUTCDay()];
    return `<div class="day"><span>${w}, ${d}/${m}</span><span class="num">${c ? '−' + ngan(c) : ''}</span></div>

}

function veBieuDo(){
  const all = gds(), trong = all.filter(g => khoaThang(g.t) === thang);
  const parts = phanDm(trong), tongChi = parts.reduce((a, p) => a + p.v, 0);
  const n = soNgay(thang), ngay = Array(n).fill(0);
  trong.filter(g => !g.thu).forEach(g => ngay[vn(g.t).getUTCDate() - 1] += g.tien);
  const max = Math.max(...ngay, 1), imax = ngay.indexOf(Math.max(...ngay));
  const thangs = [5, 4, 3, 2, 1, 0].map(b => doiThang(thang, -b));
  const tongT = thangs.map(k => all.filter(g => !g.thu && khoaThang(g.t) === k).reduce((a, g) => a + g.tien, 0));
  const maxT = Math.max(...tongT, 1);
  const coSo = tongT.filter(x => x);
  const tb = coSo.length ? coSo.reduce((a, b) => a + b, 0) / coSo.length : 0;
  return `<div class="top"><h1>Biểu đồ</h1>${oThang()}</div>
  <h2>Theo danh mục</h2>
  <div class="card"><div style="display:flex;justify-content:center;padding:6px 0 12px">${donut(parts, 170)}</div>

    <div style="margin-top:8px">${parts.length ? parts.map(p => dongLg(p, tongChi)).join('') : '<div class="muted">Chưa có khoản chi nào 🍃</div>'}</div></div>
  <h2>Từng ngày</h2>
  <div class="card"><div class="bars">${ngay.map((v, i) => `<div class="${v ? (i === imax ? 'hi' : 'v') : ''}" style="height:${v ? Math.max(v / max * 100, 3) : 1.5}%"></div>`).join('')}</div>
    <div class="axis"><span>1</span><span>${Math.ceil(n / 2)}</span><span>${n}</span></div>
    <div class="muted" style="margin-top:8px">${ngay[imax] ? 'Cao nhất ngày ' + (imax + 1) + ' · ' + ngan(ngay[imax]) : 'Chưa có khoản chi nào'}</div></div>
  <h2>6 tháng gần nhất</h2>
  <div class="card"><div class="mbars">${thangs.map((k, i) => `<div class="mbar ${k === thang ? 'cur' : ''}"><b class="num">${tongT[i] ? ngan(tongT[i]) : ''}</b><i style="height:${tongT[i] ? Math.max(tongT[i] / maxT * 100, 4) : 2}%"></i><span>T${Number(k.slice(5))}</span></div>`).join('')}</div>

function apDungMau(){

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tab') { tab = el.dataset.t; rung(); ve(); scrollTo(0, 0); }

  else if (a === 'dong') { if (e.target === el) dongSheet(); }
  else if (a === 'doidm') { dongSheet(); goi({ api:'dm', id:el.dataset.id, ten:el.dataset.ten }, 'Đã đổi danh mục'); }
  else if (a === 'xoa') xacNhan('Xóa khoản này khỏi sổ?', () => { dongSheet(); goi({ api:'xoa', id:el.dataset.id }, 'Đã xóa'); });
  else if (a === 'mau') { D.caiDat.mau = el.dataset.k; apDungMau(); ve(); goi({ api:'caidat', khoa:'mau', gt:el.dataset.k }, 'Đã đổi màu'); }

  else if (a === 'lay') goi({ api:'caidat', khoa:'do_lay', gt:el.dataset.v }, 'Đã lưu');
  else if (a === 'gmail') goi({ api:'caidat', khoa:'bao_gmail_ngay', gt:el.classList.contains('on') ? 'KHONG' : 'CO' }, 'Đã lưu');
  else if (a === 'dm') { rung(); sheetDm(el.dataset.ten); }

  else if (a === 'dmluu') {

});
document.addEventListener('change', e => {

});

  if (p.api === 'caidat') X.caiDat[p.khoa] = p.gt;
  if (p.api === 'dmluu') { const d = X.danhMuc.find(x => x.ten === p.cu); if (d) { X.gd.forEach(r => r[4] === p.cu && (r[4] = p.ten)); d.ten = p.ten; d.emoji = p.emoji; } else X.danhMuc.push({ ten:p.ten, emoji:p.emoji || '•', loai:p.loai }); }
  if (p.api === 'dmxoa') { const d = X.danhMuc.find(x => x.ten === p.ten); X.gd.forEach(r => r[4] === p.ten && (r[4] = KHAC[d.loai])); X.danhMuc = X.danhMuc.filter(x => x.ten !== p.ten); }
  if (/tab=(\w+)/.test(location.search) && !window._tabSet) { window._tabSet = 1; tab = location.search.match(/tab=(\w+)/)[1]; }
  return Promise.resolve(JSON.parse(JSON.stringify(X)));
}
